<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-card {
            width: 300px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 24px;
            margin-bottom: 10px;
            color: #222;
        }

        .product-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-button:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
            alt="Running Shoes"
            class="product-image"
        >

        <div class="product-info">

            <h2 class="product-name">Running Shoes</h2>

            <p class="product-description">
                Comfortable and stylish shoes perfect for everyday running.
            </p>

            <p class="price">₹2,499</p>

            <button class="buy-button">
                Buy Now
            </button>

        </div>
    </div>

</body>
</html>
